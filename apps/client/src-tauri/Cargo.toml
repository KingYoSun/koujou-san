[package]
name = "koujou-san-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "koujou_san_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
base64 = "=0.23.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Security_Cryptography"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Security_Credentials", "Win32_Security_Cryptography"] }
