services:
  postgres:
    ports: !override
      - "127.0.0.1:${KOUJOU_TEST_PG_PORT}:5432"
  kratos:
    ports: !override
      - "127.0.0.1:${KOUJOU_TEST_KRATOS_PORT}:4433"
      - "127.0.0.1:${KOUJOU_TEST_KRATOS_ADMIN_PORT}:4434"
    environment:
      SERVE_PUBLIC_BASE_URL: ${KOUJOU_TEST_SITE}/auth/identity/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${KOUJOU_TEST_SITE}/
      SELFSERVICE_ALLOWED_RETURN_URLS: ${KOUJOU_TEST_SITE}/
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${KOUJOU_TEST_SITE}/auth/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${KOUJOU_TEST_SITE}/auth/registration
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${KOUJOU_TEST_SITE}/auth/settings
      SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${KOUJOU_TEST_SITE}/auth/verification
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${KOUJOU_TEST_SITE}/auth/recovery
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${KOUJOU_TEST_SITE}/auth/error
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${KOUJOU_TEST_SITE}/
  hydra:
    ports: !override
      - "127.0.0.1:${KOUJOU_TEST_HYDRA_PORT}:4444"
      - "127.0.0.1:${KOUJOU_TEST_HYDRA_ADMIN_PORT}:4445"
    environment:
      URLS_SELF_ISSUER: http://127.0.0.1:${KOUJOU_TEST_HYDRA_PORT}/
      URLS_LOGIN: ${KOUJOU_TEST_SITE}/auth/login
      URLS_CONSENT: ${KOUJOU_TEST_SITE}/auth/consent
      URLS_LOGOUT: ${KOUJOU_TEST_SITE}/auth/logout
  mailpit:
    ports: !override
      - "127.0.0.1:${KOUJOU_TEST_MAILPIT_PORT}:8025"
