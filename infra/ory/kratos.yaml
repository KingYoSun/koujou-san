version: v0.13.0

serve:
  public:
    base_url: https://localhost:1420/auth/identity/
    cors:
      enabled: true
      allowed_origins:
        - https://localhost:1420
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://localhost:1420/
  allowed_return_urls:
    - https://localhost:1420/
  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: koujou-san
    code:
      enabled: true
      config:
        passwordless_enabled: false
  flows:
    error:
      ui_url: https://localhost:1420/auth/error
    login:
      ui_url: https://localhost:1420/auth/login
      after:
        password:
          hooks:
            - hook: require_verified_address
    registration:
      ui_url: https://localhost:1420/auth/registration
    settings:
      ui_url: https://localhost:1420/auth/settings
      required_aal: highest_available
    recovery:
      enabled: true
      use: code
      ui_url: https://localhost:1420/auth/recovery
    verification:
      enabled: true
      use: code
      ui_url: https://localhost:1420/auth/verification
    logout:
      after:
        default_browser_return_url: https://localhost:1420/

session:
  lifespan: 168h
  whoami:
    required_aal: highest_available

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity.schema.json

log:
  level: info
  format: json
  leak_sensitive_values: false

ciphers:
  algorithm: xchacha20-poly1305
