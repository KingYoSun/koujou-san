name: Koujou-san CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  shared-and-server:
    name: Shared UI and server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Setup repository toolchains
        run: pnpm run setup

      - name: Validate development services
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Test PostgreSQL persistence and recovery
        run: pnpm run test:database

      - name: Test Ory authentication
        run: pnpm run test:auth

      - name: Test Workspace and device authorization
        run: pnpm run test:access

      - name: Test read-only GitHub observation and recovery
        run: pnpm run test:github

      - name: Test Run records, pauses and export
        run: pnpm run test:runs

      - name: Test versioned workflows and progression
        run: pnpm run test:workflows

      - name: Test fixed inspection inputs, verdicts and evidence
        run: pnpm run test:inspections

      - name: Test shared issue requests and external confirmation
        run: pnpm run test:publications

      - name: Test work summaries and decision routing
        run: pnpm run test:workbench

      - name: Test durable automation and triage state
        run: pnpm run test:automation

      - name: Test deterministic Hopper publication and lineage
        run: pnpm run test:hopper

      - name: Test usage pricing and cost history
        run: pnpm run test:usage

      - name: Test Context versions and input manifests
        run: pnpm run test:contexts

      - name: Test shared synchronization and report ordering
        run: pnpm run test:sync

      - name: Test Bleve projection and Context search
        run: pnpm run test:search

      - name: Test ArcadeDB projection and graph exploration
        run: pnpm run test:graph

      - name: Test authenticated MCP with Ory and both projections
        run: pnpm run test:mcp

      - name: Test client selection operations and history
        run: pnpm run test:clientops

      - name: Build
        run: pnpm run build

      - name: Build standard Linux distribution
        run: pnpm run dist:server

      - name: Test packaged installation, recovery and schema 22 update
        shell: bash
        run: |
          set -eu
          mkdir -p .cache/distribution-previous
          git archive 17def2aa914e0c31cf8a03360521e57864d060d0 apps/server | tar -x -C .cache/distribution-previous
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOWORK=off "$PWD/.tools/go/bin/go" -C "$PWD/.cache/distribution-previous/apps/server" build -trimpath -o "$PWD/.cache/distribution-schema22-api" ./cmd/api
          cp apps/server/cmd/auth-bootstrap/main.go .cache/distribution-previous/apps/server/cmd/auth-bootstrap/main.go
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOWORK=off "$PWD/.tools/go/bin/go" -C "$PWD/.cache/distribution-previous/apps/server" build -trimpath -o "$PWD/.cache/distribution-schema22-auth-bootstrap" ./cmd/auth-bootstrap
          .tools/go/bin/go -C apps/server run ./cmd/devcert "$PWD/.cache/distribution-tls"
          bundle=$(find "$PWD/artifacts" -maxdepth 1 -type d -name 'server-*' -print -quit)
          python3 scripts/test-distribution-cycle.py "$bundle" "$PWD/.cache/distribution-schema22-api" "$PWD/.cache/distribution-tls" | tee test-results/distribution-cycle.log

      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-and-server-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows-native:
    name: Windows native client
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Setup repository toolchains
        run: pnpm run setup

      - name: Build shared UI and server
        run: pnpm run build

      - name: Check native client
        run: pnpm run check:desktop

      - name: Test native client
        run: pnpm run test:desktop

      - name: Build unsigned preview installer
        run: pnpm run dist:desktop

      - name: Test installed resources, Runner guard and manual reinstall
        shell: pwsh
        run: |
          $bundle = Get-ChildItem artifacts -Directory -Filter 'desktop-*' | Select-Object -First 1
          ./scripts/test-distribution-desktop.ps1 -Bundle $bundle.FullName | Tee-Object test-results/distribution-desktop.log

      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
