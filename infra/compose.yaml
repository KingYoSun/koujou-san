name: koujou-san-dev

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run pnpm run setup first}
      KOUJOU_DB_PASSWORD: ${KOUJOU_DB_PASSWORD:?Run pnpm run setup first}
      KRATOS_DB_PASSWORD: ${KRATOS_DB_PASSWORD:?Run pnpm run setup first}
      HYDRA_DB_PASSWORD: ${HYDRA_DB_PASSWORD:?Run pnpm run setup first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-koujou.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "postgres",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  arcadedb:
    image: arcadedata/arcadedb:26.10.1
    environment:
      JAVA_OPTS: "-Xmx512m"
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:?Run pnpm run setup first}
        -Darcadedb.server.defaultDatabases=koujou[root]
        -Darcadedb.maxPageRAM=16
        -Darcadedb.txWalFlush=1
      ARCADEDB_JMX: ""
    ports:
      - "127.0.0.1:2480:2480"
    volumes:
      - arcadedb-config:/home/arcadedb/config
      - arcadedb-data:/home/arcadedb/databases
      - arcadedb-replication:/home/arcadedb/replication
      - arcadedb-backups:/home/arcadedb/backups
      - arcadedb-logs:/home/arcadedb/log
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2480/api/v1/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command:
      ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos.yaml"]
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?Run pnpm run setup first}@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./ory/kratos.yaml:/etc/config/kratos.yaml:ro
      - ./ory/identity.schema.json:/etc/config/identity.schema.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kratos:
    image: oryd/kratos:v26.2.0
    command:
      [
        "serve",
        "--dev",
        "--watch-courier",
        "--config",
        "/etc/config/kratos.yaml",
      ]
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?Run pnpm run setup first}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:?Run pnpm run setup first}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:?Run pnpm run setup first}
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:4434:4434"
    volumes:
      - ./ory/kratos.yaml:/etc/config/kratos.yaml:ro
      - ./ory/identity.schema.json:/etc/config/identity.schema.json:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "kratos",
          "remote",
          "status",
          "--endpoint",
          "http://127.0.0.1:4434",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command:
      ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/hydra.yaml"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?Run pnpm run setup first}@postgres:5432/hydra?sslmode=disable
    volumes:
      - ./ory/hydra.yaml:/etc/config/hydra.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hydra:
    image: oryd/hydra:v26.2.0
    command: ["serve", "all", "--dev", "--config", "/etc/config/hydra.yaml"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?Run pnpm run setup first}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?Run pnpm run setup first}
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"
    volumes:
      - ./ory/hydra.yaml:/etc/config/hydra.yaml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:18025:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  arcadedb-config:
  arcadedb-data:
  arcadedb-replication:
  arcadedb-backups:
  arcadedb-logs:
