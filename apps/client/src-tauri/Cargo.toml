[package]
name = "koujou-san-desktop"
default-run = "koujou-san-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "koujou_san_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
base64 = "=0.23.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "c73622dfca02bfe55d29a6a0612e181119cab9b8", default-features = false }
rig-agent = { git = "https://github.com/0xPlaygrounds/rig", rev = "c73622dfca02bfe55d29a6a0612e181119cab9b8", default-features = false }
futures-util = "=0.3.34"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Security_Credentials", "Win32_Security_Cryptography"] }
